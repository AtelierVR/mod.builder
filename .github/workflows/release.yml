# ═══════════════════════════════════════════════════════════════
# Reusable — publish .noxmod packages to GitHub Releases
# ═══════════════════════════════════════════════════════════════

name: Release

on:
  workflow_call:
    inputs:
      mod_id:
        type: string
        required: true
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      prerelease:
        type: string
        default: "false"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - uses: actions/download-artifact@v4
        with:
          name: manifest
          path: .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.mod_id }} ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          generate_release_notes: true
          files: |
            packages/*.zip
            manifest.json
