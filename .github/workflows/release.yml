# ═══════════════════════════════════════════════════════════════
# Reusable — publish .noxmod to GitHub Releases
# ═══════════════════════════════════════════════════════════════

name: Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      prerelease:
        type: string
        default: "false"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read mod id
        id: meta
        shell: bash
        run: echo "mod_id=$(jq -r '.id' nox.mod.jsonc)" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.meta.outputs.mod_id }}-mod

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ steps.meta.outputs.mod_id }} ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.mod_id }}.noxmod
