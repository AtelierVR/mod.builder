# ═══════════════════════════════════════════════════════════════
# Reusable — compute next semver + validate, no side effects
# ═══════════════════════════════════════════════════════════════

name: Prepare

on:
  workflow_call:
    inputs:
      override:
        type: string
        default: ""
    outputs:
      mod_id:
        value: ${{ jobs.version.outputs.mod_id }}
      version:
        value: ${{ jobs.version.outputs.version }}
      tag:
        value: ${{ jobs.version.outputs.tag }}
      prerelease:
        value: ${{ jobs.version.outputs.prerelease }}
      valid:
        value: ${{ jobs.version.outputs.valid }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      mod_id: ${{ steps.meta.outputs.mod_id }}
      version: ${{ steps.semver.outputs.resolved }}
      tag: ${{ steps.semver.outputs.tag }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/checkout@v4
        with:
          repository: AtelierVR/mod.builder
          path: .mod-builder

      - name: Mod builder version
        shell: bash
        run: bash .mod-builder/scripts/mod-builder-version.sh

      - run: git fetch --tags --force

      - name: Compute
        id: semver
        env:
          VERSION_OVERRIDE: ${{ inputs.override }}
        shell: bash
        run: bash .mod-builder/scripts/compute-version.sh

      - name: Read mod id
        id: meta
        shell: bash
        run: bash .mod-builder/scripts/read-mod-id.sh

      - name: Validate
        id: validate
        shell: bash
        run: bash .mod-builder/scripts/validate-mod-id.sh "${{ steps.meta.outputs.mod_id }}" "${{ steps.semver.outputs.resolved }}" "${{ steps.semver.outputs.tag }}"
