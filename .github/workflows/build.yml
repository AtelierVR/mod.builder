# ═══════════════════════════════════════════════════════════════
# Reusable — build any Nox mod for multiple platforms in parallel
# ═══════════════════════════════════════════════════════════════

name: Build Mod

on:
  workflow_call:
    inputs:
      mod_id:
        type: string
        required: true
      version:
        type: string
        default: ""
      platforms:
        type: string
        required: true
        description: "Space-separated list: windows, linux, macos, android, ios"
      no_library_cache:
        type: boolean
        default: false
        description: "Skip restoring the Library cache"
    secrets:
      UNITY_LICENSE:
        required: true
        description: "Unity license file content (scripts/get-unity-license.sh)"
      UNITY_EMAIL:
        required: true
        description: "Unity account email"
      UNITY_PASSWORD:
        required: true
        description: "Unity account password"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_id: ${{ inputs.mod_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod
          lfs: true

      - uses: actions/checkout@v4
        with:
          repository: AtelierVR/mod.builder
          path: .mod-builder

      - name: Setup project
        env:
          MOD_ID: ${{ inputs.mod_id }}
          MOD_DIR: mod
        shell: bash
        run: bash .mod-builder/scripts/setup-unity-project.sh

      - name: Set version
        shell: bash
        run: bash .mod-builder/scripts/set-version.sh "${{ inputs.mod_id }}" "${{ inputs.version }}"

      - uses: actions/cache@v4
        if: ${{ !inputs.no_library_cache }}
        with:
          path: project/Library
          key: Library-${{ inputs.mod_id }}-${{ hashFiles('project/Packages/**') }}
          restore-keys: Library-${{ inputs.mod_id }}-

      - name: Init git (required by unity-builder)
        shell: bash
        run: bash .mod-builder/scripts/init-git.sh

      - name: Pre-build
        id: output
        env:
          PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: bash .mod-builder/scripts/pre-build.sh "${{ inputs.mod_id }}" "${{ inputs.version }}"

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: project
          unityVersion: 6000.4.4f1
          targetPlatform: StandaloneWindows64
          buildMethod: Nox.GameBuilder.Pipeline.ExternalBuilder.BuildMod
          allowDirtyBuild: true
          manualExit: true
          customParameters: >-
            -accept-apiupdate
            --noxMod ${{ inputs.mod_id }}
            --noxOutput ${{ steps.output.outputs.args }}
            --githubAction

      - name: Post-build
        if: always()
        env:
          PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: bash .mod-builder/scripts/post-build.sh "${{ inputs.mod_id }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-build
          path: |
            project/Assets/link.xml
            project/Packages/manifest.json
            ~/.nox/logs/latest.log
            ~/.config/unity3d/Editor.log
          if-no-files-found: ignore

      - name: Package all platforms
        env:
          MOD_ID: ${{ inputs.mod_id }}
          MOD_VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: bash .mod-builder/scripts/generate-packages.sh

      - name: Generate manifest
        env:
          MOD_ID: ${{ inputs.mod_id }}
          MOD_VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          GH_NAME: ${{ github.event.repository.name }}
          GH_DESC: ${{ github.event.repository.description }}
          GH_LICENSE: ${{ github.event.repository.license.spdx_id }}
        shell: bash
        run: bash .mod-builder/scripts/generate-manifest.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ inputs.mod_id }}-${{ inputs.version }}-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: manifest.json
