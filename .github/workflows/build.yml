# ═══════════════════════════════════════════════════════════════
# Reusable — build any Nox mod (DLLs + AssetBundles)
# ═══════════════════════════════════════════════════════════════

name: Build Mod

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_id: ${{ steps.meta.outputs.mod_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod

      - uses: actions/checkout@v4
        with:
          repository: AtelierVR/mod.builder
          path: .mod-builder

      - name: Read metadata
        id: meta
        shell: bash
        run: |
          MANIFEST="mod/nox.mod.json"
          [ -f "$MANIFEST" ] || MANIFEST="mod/nox.mod.jsonc"
          echo "mod_id=$(jq -r '.id' "$MANIFEST")" >> $GITHUB_OUTPUT
          V="${VERSION_INPUT:-$(jq -r '.version' "$MANIFEST")}"
          echo "version=$V" >> $GITHUB_OUTPUT
        env:
          VERSION_INPUT: ${{ inputs.version }}

      - name: Setup project
        env:
          MOD_ID: ${{ steps.meta.outputs.mod_id }}
          MOD_DIR: mod
        shell: bash
        run: bash .mod-builder/scripts/setup-unity-project.sh

      - name: Set version
        shell: bash
        run: |
          MOD_ID="${{ steps.meta.outputs.mod_id }}"
          V="${{ steps.meta.outputs.version }}"
          MANIFEST="project/Packages/$MOD_ID/nox.mod.json"
          [ -f "$MANIFEST" ] || MANIFEST="project/Packages/$MOD_ID/nox.mod.jsonc"
          echo "Setting version: $MOD_ID → $V"
          jq --arg v "$V" '.version = $v' "$MANIFEST" > tmp.json && mv tmp.json "$MANIFEST"

      - uses: actions/cache@v4
        with:
          path: project/Library
          key: Library-${{ steps.meta.outputs.mod_id }}-${{ hashFiles('project/Packages/**') }}
          restore-keys: Library-${{ steps.meta.outputs.mod_id }}-

      - name: Init git (required by unity-builder)
        shell: bash
        run: |
          cd project
          git init
          git config user.email "ci@mod.builder"
          git config user.name "mod.builder"
          git add -A
          git commit -m "init" --no-verify || true

      - name: Pre-build
        shell: bash
        run: |
          echo "::group::Pre-build"
          echo "Mod     : ${{ steps.meta.outputs.mod_id }}"
          echo "Version : ${{ steps.meta.outputs.version }}"
          echo "::notice title=Pre-build::${{ steps.meta.outputs.mod_id }} v${{ steps.meta.outputs.version }}"
          echo "::endgroup::"

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: project
          unityVersion: 6000.4.4f1
          targetPlatform: StandaloneWindows64
          buildMethod: Nox.GameBuilder.Pipeline.ExternalBuilder.BuildMod
          allowDirtyBuild: true
          manualExit: true
          customParameters: >-
            -noxModToBuild ${{ steps.meta.outputs.mod_id }}
            -noxOutputPath build/${{ steps.meta.outputs.mod_id }}

      - name: Post-build
        if: always()
        shell: bash
        run: |
          echo "::group::Post-build"
          MOD_ID="${{ steps.meta.outputs.mod_id }}"
          OUTPUT="project/build/$MOD_ID"
          if [ -d "$OUTPUT" ]; then
            DLLS=$(find "$OUTPUT" -name "*.dll" | wc -l)
            BUNDLES=$(find "$OUTPUT" -name "*.assets" -o -name "*.scenes" -o -name "*.scriptables" | wc -l)
            echo "DLLs: $DLLS  AssetBundles: $BUNDLES"
            echo "::notice title=Post-build::$MOD_ID built ($DLLS DLLs, $BUNDLES bundles)"
          else
            echo "::warning title=Post-build::Build failed, no output found"
          fi
          echo "::endgroup::"

      - name: Upload manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.mod_id }}-manifest
          path: project/Packages/manifest.json

      - name: Package
        id: package
        env:
          MOD_ID: ${{ steps.meta.outputs.mod_id }}
        shell: bash
        run: bash .mod-builder/scripts/package-mod.sh "$MOD_ID" "project/build/$MOD_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.mod_id }}-mod
          path: ${{ steps.package.outputs.archive }}
