# ═══════════════════════════════════════════════════════════════
# Reusable — compute next semver, no side effects
# ═══════════════════════════════════════════════════════════════

name: Version

on:
  workflow_call:
    inputs:
      override:
        type: string
        default: ""
    outputs:
      resolved:
        value: ${{ jobs.version.outputs.resolved }}
      tag:
        value: ${{ jobs.version.outputs.tag }}
      prerelease:
        value: ${{ jobs.version.outputs.prerelease }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      resolved: ${{ steps.semver.outputs.resolved }}
      tag: ${{ steps.semver.outputs.tag }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: AtelierVR/mod.builder
          path: .mod-builder

      - run: git fetch --tags --force

      - name: Compute
        id: semver
        env:
          VERSION_OVERRIDE: ${{ inputs.override }}
        shell: bash
        run: bash .mod-builder/scripts/compute-version.sh
