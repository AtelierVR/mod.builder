# ═══════════════════════════════════════════════════════════════
# Reusable — compute version + bump nox.mod.jsonc + commit
# ═══════════════════════════════════════════════════════════════

name: Version

on:
  workflow_call:
    inputs:
      override:
        type: string
        default: ""
    outputs:
      resolved:
        value: ${{ jobs.version.outputs.resolved }}
      tag:
        value: ${{ jobs.version.outputs.tag }}
      prerelease:
        value: ${{ jobs.version.outputs.prerelease }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      resolved: ${{ steps.semver.outputs.resolved }}
      tag: ${{ steps.semver.outputs.tag }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: AtelierVR/mod.builder
          path: .mod-builder

      - run: git fetch --tags --force

      - name: Compute
        id: semver
        env:
          VERSION_OVERRIDE: ${{ inputs.override }}
        shell: bash
        run: bash .mod-builder/scripts/compute-version.sh

      - name: Bump & commit
        shell: bash
        run: |
          jq --arg v "${{ steps.semver.outputs.resolved }}" '.version = $v' \
            nox.mod.jsonc > tmp.json && mv tmp.json nox.mod.jsonc
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nox.mod.jsonc
          git commit -m "chore: bump to ${{ steps.semver.outputs.resolved }} [skip ci]" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }}
